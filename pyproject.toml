[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rain-generator"
version = "2.0.0"
authors = [
    { name = "Andre Oliveira", email = "azuletto@users.noreply.github.com" },
    { name = "Ahmad Hassan", email = "ahmadhassan@users.noreply.github.com" }
]
description = "An immersive, procedural rain and thunderstorm simulator with dynamic audio synthesis and particle physics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["rain", "thunderstorm", "simulator", "pygame", "audio-synthesis", "particles", "procedural"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Games/Entertainment :: Simulation"
]
dependencies = [
    "pygame>=2.1.0",
    "numpy>=1.20.0",
    "sounddevice>=0.4.0",
    "scipy>=1.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/azuletto/rain_generator"
Repository = "https://github.com/azuletto/rain_generator.git"
"Bug Tracker" = "https://github.com/azuletto/rain_generator/issues"

[project.scripts]
rain-generator = "rain_generator.simulator:main"
thunderstorm = "rain_generator.simulator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rain_generator*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
